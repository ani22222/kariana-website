<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 638" width="1012" height="638">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02150f" />
      <stop offset="50%" stop-color="#062e21" />
      <stop offset="100%" stop-color="#02150f" />
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Card Clip Path for Rounded Corners -->
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1012" height="638" rx="32" ry="32" />
    </clipPath>
    
    <!-- Photo Clip -->
    <clipPath id="photoClip">
      <rect x="70" y="160" width="220" height="260" rx="16" ry="16" />
    </clipPath>
  </defs>

  <!-- Base Card with Rounded Corners -->
  <g clip-path="url(#cardClip)">
    <rect width="1012" height="638" fill="url(#bgGrad)" />

    <!-- Islamic Geometric Border Accent -->
    <rect x="16" y="16" width="980" height="606" rx="24" ry="24" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85" />
    <rect x="24" y="24" width="964" height="590" rx="18" ry="18" fill="none" stroke="#047857" stroke-width="1.5" opacity="0.5" />

    <!-- Top Header Bar -->
    <rect x="20" y="20" width="972" height="110" fill="#042017" />
    <line x1="20" y1="130" x2="992" y2="130" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Logo Monogram -->
    <circle cx="85" cy="75" r="38" fill="#064e3b" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="85" y="85" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="28" font-weight="bold" fill="#fef08a" text-anchor="middle">ক্ব</text>

    <!-- Header Titles -->
    <text x="145" y="65" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="0.5">কারিয়ানা কুরআন শিক্ষা সোসাইটি</text>
    <text x="145" y="98" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="16" fill="#a7f3d0" font-weight="600">কেন্দ্রীয় কার্যালয় • নিবন্ধিত মুয়াল্লিম ও শিক্ষক পরিচয়পত্র</text>

    <!-- Validity Badge (1-Year Validity) -->
    <rect x="780" y="45" width="180" height="42" rx="21" ry="21" fill="#065f46" stroke="url(#goldGrad)" stroke-width="1.5" />
    <text x="870" y="72" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="15" font-weight="bold" fill="#fef08a" text-anchor="middle">মেয়াদ: ১ বছর</text>

    <!-- Teacher Photo Frame -->
    <rect x="66" y="156" width="228" height="268" rx="20" ry="20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <rect x="70" y="160" width="220" height="260" rx="16" ry="16" fill="#031c14" />
    <g id="teacherPhoto" clip-path="url(#photoClip)">
      <!-- Placeholder SVG Avatar or Dynamic Image -->
      <circle cx="180" cy="250" r="55" fill="#044331" />
      <path d="M110 390 C110 320, 250 320, 250 390 Z" fill="#044331" />
      <text x="180" y="405" font-family="'Hind Siliguri', sans-serif" font-size="14" fill="#6ee7b7" text-anchor="middle">মুয়াল্লিম ছবি</text>
    </g>

    <!-- Teacher Code Ribbon under Photo -->
    <rect x="66" y="438" width="228" height="38" rx="8" ry="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="180" y="463" font-family="'Courier New', monospace" font-size="17" font-weight="bold" fill="#fef08a" text-anchor="middle">{{TEACHER_CODE}}</text>

    <!-- Teacher Information Section -->
    <g transform="translate(325, 160)">
      <!-- Name -->
      <text x="0" y="32" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="15" fill="#a7f3d0" font-weight="600">শিক্ষক / মুয়াল্লিমের নাম:</text>
      <text x="0" y="70" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="30" font-weight="bold" fill="#ffffff">{{TEACHER_NAME}}</text>
      <line x1="0" y1="85" x2="400" y2="85" stroke="#065f46" stroke-width="1" />

      <!-- District -->
      <text x="0" y="125" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="16" fill="#a7f3d0">দায়িত্বপ্রাপ্ত জেলা:</text>
      <text x="145" y="125" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="19" font-weight="bold" fill="#fef08a">{{DISTRICT}}</text>

      <!-- Phone -->
      <text x="0" y="165" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="16" fill="#a7f3d0">মোবাইল নম্বর:</text>
      <text x="145" y="165" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="600" fill="#ffffff">{{PHONE}}</text>

      <!-- Approved Date -->
      <text x="0" y="205" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="16" fill="#a7f3d0">অনুমোদনের তারিখ:</text>
      <text x="145" y="205" font-family="'Hind Siliguri', sans-serif" font-size="17" font-weight="600" fill="#ffffff">{{APPROVED_DATE}}</text>

      <!-- Valid Till -->
      <text x="0" y="245" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="16" fill="#a7f3d0">মেয়াদ উত্তীর্ণের তারিখ:</text>
      <text x="145" y="245" font-family="'Hind Siliguri', sans-serif" font-size="18" font-weight="bold" fill="#34d399">{{EXPIRY_DATE}}</text>
    </g>

    <!-- QR Code Block for Live Public Accreditation Verification -->
    <g transform="translate(775, 175)">
      <rect x="0" y="0" width="170" height="170" rx="12" ry="12" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" />
      <!-- Embedded QR Code or Dynamic Holder -->
      <g id="qrCodeHolder">
        <rect x="15" y="15" width="140" height="140" fill="#02150f" />
        <rect x="25" y="25" width="40" height="40" fill="#ffffff" />
        <rect x="30" y="30" width="30" height="30" fill="#02150f" />
        <rect x="35" y="35" width="20" height="20" fill="#ffffff" />
        <rect x="105" y="25" width="40" height="40" fill="#ffffff" />
        <rect x="110" y="30" width="30" height="30" fill="#02150f" />
        <rect x="115" y="35" width="20" height="20" fill="#ffffff" />
        <rect x="25" y="105" width="40" height="40" fill="#ffffff" />
        <rect x="30" y="110" width="30" height="30" fill="#02150f" />
        <rect x="35" y="115" width="20" height="20" fill="#ffffff" />
        <!-- Random QR Pattern Elements -->
        <rect x="75" y="35" width="20" height="20" fill="#ffffff" />
        <rect x="75" y="65" width="20" height="40" fill="#ffffff" />
        <rect x="105" y="75" width="30" height="20" fill="#ffffff" />
        <rect x="75" y="115" width="40" height="20" fill="#ffffff" />
      </g>
      <text x="85" y="195" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle" font-weight="600">ভেরিফাই করতে স্ক্যান করুন</text>
    </g>

    <!-- Signatures Section -->
    <g transform="translate(680, 420)">
      <line x1="80" y1="50" x2="260" y2="50" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 2" />
      <!-- Signature SVG Flourish -->
      <path d="M 100 45 Q 140 10, 170 40 T 230 35 T 250 45" fill="none" stroke="#fef08a" stroke-width="2" />
      <text x="170" y="70" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">মাওলানা সাদ্দাম হোসেন</text>
      <text x="170" y="88" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#6ee7b7" text-anchor="middle">প্রধান পরিচালক ও মহাসচিব</text>
    </g>

    <!-- Bottom Footer Bar -->
    <rect x="20" y="555" width="972" height="63" fill="#02150f" />
    <line x1="20" y1="555" x2="992" y2="555" stroke="url(#goldGrad)" stroke-width="2" />
    <text x="506" y="582" font-family="'Hind Siliguri', 'SolaimanLipi', sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">
      এই পরিচয়পত্রটি কারিয়ানা কুরআন শিক্ষা সোসাইটির কেন্দ্রীয় ডাটাবেজে এনক্রিপ্টেড ও কিউআর কোডে ভেরিফাইড।
    </text>
    <text x="506" y="604" font-family="'Hind Siliguri', sans-serif" font-size="12" fill="#fef08a" text-anchor="middle">
      অনলাইন ভেরিফিকেশন: https://project.rasel.cloud/kariana/verify
    </text>
  </g>
</svg>
