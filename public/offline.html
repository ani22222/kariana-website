<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>ইন্টারনেট সংযোগ বিচ্ছিন্ন | কারিয়ানা কুরআন</title>
    <meta name="theme-color" content="#022c22">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Hind Siliguri', sans-serif; }
        body {
            background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #011d17 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .offline-card {
            background: rgba(2, 44, 34, 0.85);
            border: 2px solid rgba(245, 158, 11, 0.4);
            border-radius: 28px;
            padding: 36px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(245, 158, 11, 0.15);
            backdrop-filter: blur(16px);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(245, 158, 11, 0.15);
            border: 2px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-circle svg {
            width: 44px;
            height: 44px;
            color: #fbbf24;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #fef3c7;
            margin-bottom: 8px;
        }
        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        p {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-retry {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #022c22;
            font-weight: 800;
            font-size: 15px;
            padding: 13px 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
        }
        .btn-retry:active {
            transform: scale(0.97);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            font-weight: 600;
            font-size: 14px;
            padding: 11px 18px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-back:active {
            background: rgba(255, 255, 255, 0.15);
        }
        .footer-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-circle">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-5.657m0 0l2.828 2.828M3 3l18 18" />
            </svg>
        </div>
        <span class="badge">অফলাইন মোড</span>
        <h1>ইন্টারনেট সংযোগ নেই</h1>
        <p>আপনার ফোনের মোবাইল ডাটা অথবা ওয়াইফাই সংযোগ পরীক্ষা করুন। সংযোগ ফিরে আসার সাথে সাথে পেজটি স্বয়ংক্রিয়ভাবে চালু হবে।</p>
        
        <div class="btn-group">
            <button class="btn-retry" onclick="window.location.reload()">🔄 পুনরায় চেষ্টা করুন</button>
            <button class="btn-back" onclick="if(window.history.length > 1){ window.history.back(); } else { window.location.href='/'; }">⬅️ পূর্বের পাতায় ফিরুন</button>
        </div>

        <div class="footer-text">
            কারিয়ানা কুরআন শিক্ষা সোসাইটি • বাংলাদেশ
        </div>
    </div>

    <script>
        // Auto reload when internet connection restores
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
